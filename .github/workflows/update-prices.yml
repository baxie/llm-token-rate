name: Verify official model prices

on:
  schedule:
    - cron: "17 2 * * *" # daily 10:17 Asia/Shanghai (UTC+8)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate catalogue
        run: python -m llm_price_tracker.cli validate
        env:
          PYTHONPATH: src
      - name: Run tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - name: Check official sources
        run: python -m llm_price_tracker.cli refresh --timeout 45
        env:
          PYTHONPATH: src
      - name: Rebuild rendered catalogue
        run: python -m llm_price_tracker.cli build
        env:
          PYTHONPATH: src
      - name: Email latest price report
        run: python -m llm_price_tracker.send_report --report docs/PRICEBOOK.html
        env:
          PYTHONPATH: src
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
      - name: Create source-change branch when needed
        id: source_change
        run: |
          if git diff --quiet; then
            echo "No verified source-content change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/price-source-audit-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/source-status.json data/model-discovery.json docs/PRICEBOOK.md docs/PRICEBOOK.html
          git commit -m "chore: refresh price-source audit"
          git push --set-upstream origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open review pull request
        if: steps.source_change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "${{ steps.source_change.outputs.branch }}" \
            --title "chore: review official price-source changes" \
            --body "Daily source audit detected a content or model-discovery change. Review the linked official pages and update the audited data rows before merging."
