name: Verify official model prices

on:
  schedule:
    - cron: "17 2 * * *" # daily 10:17 Asia/Shanghai (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate catalogue
        run: python -m llm_price_tracker.cli validate
        env:
          PYTHONPATH: src
      - name: Run tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - name: Check official sources
        run: python -m llm_price_tracker.cli refresh --timeout 45
        env:
          PYTHONPATH: src
      - name: Rebuild rendered catalogue
        run: python -m llm_price_tracker.cli build
        env:
          PYTHONPATH: src
      - name: Email latest price report
        run: python -m llm_price_tracker.send_report --report docs/PRICEBOOK.html
        env:
          PYTHONPATH: src
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
      - name: Commit source-change audit when needed
        run: |
          if git diff --quiet; then
            echo "No verified source-content change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-status.json docs/PRICEBOOK.md
          git commit -m "chore: refresh price-source audit"
          git push
